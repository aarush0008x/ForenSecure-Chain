<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10231f">
  <title>ForenSecure Chain | Evidence Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span>F</span></div>
        <div><strong>ForenSecure</strong><small>CHAIN</small></div>
      </div>
      <p class="sidebar-label">WORKSPACE</p>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◈</span>Dashboard</button>
        <button class="nav-item" data-view="files"><span class="nav-icon">▤</span>Evidence files</button>
        <button class="nav-item" data-view="erasure"><span class="nav-icon">⌁</span>Secure erasure</button>
        <button class="nav-item" data-view="recovery"><span class="nav-icon">⌗</span>File recovery</button>
        <button class="nav-item" data-view="verification"><span class="nav-icon">✓</span>Verification</button>
        <button class="nav-item" data-view="ledger"><span class="nav-icon">▥</span>Audit ledger</button>
        <button class="nav-item" data-view="audit"><span class="nav-icon">≡</span>Audit trail</button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">□</span>Reports</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="chain-status"><span class="status-dot"></span><div><strong>Chain online</strong><small>Local prototype ledger</small></div></div>
        <div class="brand-note">Erasing with certainty,<br>recovering with integrity.</div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div class="crumbs"><span id="crumbSection">Overview</span><b>/</b><strong id="crumbPage">Dashboard</strong></div>
        <div class="top-actions">
          <span class="api-indicator"><i></i><span id="apiStatus">Checking API</span></span>
          <button class="icon-button" id="refreshButton" title="Refresh data" aria-label="Refresh data">↻</button>
          <span class="top-date" id="todayDate"></span>
          <div class="operator"><span class="operator-avatar">FC</span><span>Forensics<br><small>Operator</small></span></div>
        </div>
      </header>

      <div id="toastRegion" class="toast-region" aria-live="polite"></div>
      <section id="viewRoot" class="view-root" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-card">
      <div class="modal-kicker">DESTRUCTIVE OPERATION</div>
      <h2 id="confirmTitle">Confirm secure erasure</h2>
      <p id="confirmText">This will overwrite and delete the selected controlled file.</p>
      <div class="modal-actions"><button class="button secondary" data-close-modal>Cancel</button><button class="button danger" id="confirmAction">Confirm erasure</button></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
